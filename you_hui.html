    <div class="wb-tip">
        <span class="wb-title">请在浏览器中打开</span>
        <span class="wb-line">微信内置浏览器会拦截本页的应用跳转链接（URL Scheme）。</span>
        <span class="wb-line">点击右上角 <b>···</b> → 选择「<b>在浏览器打开</b>」</span>
        <span class="wb-line">用手机自带浏览器打开本页后，再点对应入口即可唤起 App。</span>
        <span class="wb-btns">
      <button type="button" class="wb-btn" id="wbWxCopy">复制本页地址</button>
      <button type="button" class="wb-btn" id="wbWxClose">我知道了</button>
    </span>

<script>
    (function () {
        var ua = navigator.userAgent || '';
        var inWeChat = /MicroMessenger/i.test(ua) && !/wxwork/i.test(ua);
        if (!inWeChat) return;
        var mask = document.getElementById('wbWxMask');
        if (!mask) return;
        mask.classList.add('wb-show');
        mask.setAttribute('aria-hidden', 'false');

        function closeMask() {
            mask.classList.remove('wb-show');
            mask.setAttribute('aria-hidden', 'true');
        }

        function toast(msg) {
            var t = document.createElement('div');
            t.className = 'wb-toast';
            t.textContent = msg;
            mask.appendChild(t);
            setTimeout(function () {
                if (t.parentNode) t.parentNode.removeChild(t);
            }, 1800);
        }

        function legacyCopy(text, ok, fail) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            var done = false;
            try {
                done = document.execCommand('copy');
            } catch (e) {
                done = false;
            }
            if (ta.parentNode) ta.parentNode.removeChild(ta);
            if (done) ok(); else fail();
        }

        document.getElementById('wbWxClose').addEventListener('click', closeMask);
        mask.addEventListener('click', function (e) {
            if (e.target === mask) closeMask();
        });
        document.getElementById('wbWxCopy').addEventListener('click', function () {
            var url = window.location.href;
            var ok = function () {
                toast('已复制，粘贴到浏览器打开');
            };
            var fail = function () {
                toast('复制失败，请长按地址栏复制');
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(url).then(ok, function () {
                    legacyCopy(url, ok, fail);
                });
            } else {
                legacyCopy(url, ok, fail);
            }
        });
    })();
</script>
